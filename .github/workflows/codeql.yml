# Quét lỗ hổng bảo mật mã JavaScript bằng CodeQL (công cụ chính chủ của GitHub, miễn phí cho kho công khai).
# Kết quả xem ở tab Security → Code scanning.
name: Quét bảo mật CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 3 * * 1' # 10:23 sáng thứ Hai (giờ Việt Nam) hằng tuần

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
