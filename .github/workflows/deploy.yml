# Quy trình CI/CD chính.
#  - Pull request: kiểm thử + đóng gói thử (không đăng).
#  - Đẩy lên main: kiểm thử → đóng gói dist/ → đăng GitHub Pages. Bước nào lỗi thì dừng, web đang chạy giữ nguyên.
# Không có thư viện ngoài nên không cần npm install. Chỉ dùng action chính chủ của GitHub (actions/*).
name: Kiểm thử, đóng gói và đăng website

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Quyền tối thiểu mặc định: chỉ đọc mã. Job đăng web xin thêm quyền riêng của nó.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Kiểm thử (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node: [22, 24] # Node 20 đã hết hạn hỗ trợ (04/2026) và không hiểu mẫu đường dẫn tests/*.test.mjs
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  build:
    name: Đóng gói
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Chép web/ → dist/, đóng dấu phiên bản + commit, kiểm tra đường dẫn hỏng, ngân sách dung lượng
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    name: Đăng GitHub Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
