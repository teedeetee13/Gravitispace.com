<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>An Sao Space</title>
  <script>
    // GitHub Pages trả trang này cho mọi đường dẫn không tồn tại → đưa về trang chính.
    // Trang dự án (*.github.io/ten-repo/) cần giữ lại đoạn /ten-repo/.
    (function () {
      var seg = location.pathname.split('/')[1];
      var base = location.hostname.endsWith('github.io') && seg ? '/' + seg + '/' : '/';
      location.replace(base);
    })();
  </script>
</head>
