<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Graviti</title>
  <script>
    // Đường dẫn không tồn tại → về trang chính. Trên GitHub Pages dạng dự án (*.github.io/ten-kho/) giữ lại /ten-kho/.
    (function () {
      var seg = location.pathname.split('/')[1];
      var base = location.hostname.endsWith('github.io') && seg ? '/' + seg + '/' : '/';
      location.replace(base);
    })();
  </script>

</head>
<body>
  <main>
    <p>Lạc giữa không gian rồi. Lực hút sẽ đưa bạn về. · Lost in space, gravity will bring you back.</p>

  </main>

</html>
