<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- Trang Tài khoản chung của cả hệ Graviti. Máy chủ ngoài duy nhất được gọi: Supabase (tài khoản, đồng bộ). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <meta name="robots" content="noindex" />
  <title>Tài khoản · Graviti</title>
  <meta name="description" content="Quản lý tài khoản Graviti: đồng bộ, đổi mật khẩu, đăng xuất, xoá tài khoản." />
  <meta name="theme-color" content="#f6f1e9" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#110f18" media="(prefers-color-scheme: dark)" />
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../assets/css/hub.css" />
  <link rel="stylesheet" href="../stars/assets/css/login.css" />
  <script src="../assets/js/boot.js"></script>
</head>
<body>
  <a class="skip" href="#main" data-i18n="skip">Bỏ qua tới nội dung</a>

  <header class="topbar">
    <div class="wrap topbar-in">
      <a class="logo" href="../" aria-label="Graviti">
        <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true"><circle class="lm-core" cx="16" cy="16" r="5"/><ellipse class="lm-orbit" cx="16" cy="16" rx="13" ry="6.5" transform="rotate(-24 16 16)"/><circle class="lm-moon" cx="27.2" cy="10.4" r="2.3"/></svg>
        <span>Graviti</span>
      </a>
      <div class="tools">
        <label class="lang-pick"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.5"/><path d="M3.5 12h17M12 3.5c2.5 2.6 3.5 5.4 3.5 8.5s-1 5.9-3.5 8.5c-2.5-2.6-3.5-5.4-3.5-8.5s1-5.9 3.5-8.5z"/></svg><select data-lang-select data-i18n-aria="lang.aria" aria-label="Chọn ngôn ngữ"></select></label>
        <button class="icon-btn" type="button" data-theme-toggle data-i18n-aria="theme.aria" aria-label="Đổi giao diện sáng / tối">
          <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M18.5 14.8A7 7 0 0 1 9.2 5.5a7 7 0 1 0 9.3 9.3z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Nội dung do assets/js/account.js vẽ: khách → nút đăng nhập (hộp nổi); đã đăng nhập → đồng bộ, đổi mật khẩu, đăng xuất, xoá tài khoản -->
  <main id="main" class="wrap acct-page"></main>

  <footer class="footer">
    <div class="wrap">
      <p class="muted">© <span data-year>2026</span> Graviti · gravitispace.com · <a href="../privacy/" data-i18n="home.privacy">Quyền riêng tư</a></p>
    </div>
  </footer>

  <noscript><p class="wrap">Graviti cần JavaScript để hiển thị đầy đủ. · Graviti needs JavaScript.</p></noscript>
  <script type="module" src="../assets/js/account.js"></script>
</body>
</html>
